name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the IndexNow step diffs this push against the previous one
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Gate the deploy: the daily blog routine pushes new HTML straight to main,
      # so this is where a re-introduced ad script or an unescaped post field gets
      # caught — before it reaches the live site.
      - run: npm test
      - run: npm run build
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy
          npx --yes wrangler@4 deploy -c wrangler-synth.toml
      # Ask IndexNow engines (Bing and others) to re-crawl the blog pages this
      # push added or changed. Best effort: a refusal never fails the deploy.
      - name: IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs --changed "${{ github.event.before }}"
