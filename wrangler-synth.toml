name = "synth-jfound"
main = "synth-worker.js"
compatibility_date = "2026-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[env.staging]
name = "synth-jfound-staging"
main = "synth-staging-worker.js"
workers_dev = true

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
